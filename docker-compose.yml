services:
  # 1. Service Base de données
  db:
    image: mysql:8.0
    container_name: myfamily_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Service API Back-end
  backend:
    build: ./mfa-backend
    container_name: myfamily_backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db

  # 3. Service Interface Front-end
  frontend:
    build: ./mfa-frontend
    container_name: myfamily_frontend
    ports:
      - "5173:80" # On map le port 5173 du PC sur le port 80 de Nginx
    depends_on:
      - backend

volumes:
  db_data: