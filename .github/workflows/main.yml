name: Pipeline CI/CD MyFamilyAppli

on:
  push:
    branches: [ "main" ]

jobs:
  # --- PHASE 1 : INTÉGRATION CONTINUE (CI) ---
  ci-testing:
    runs-on: ubuntu-latest

    # Service MySQL éphémère pour exécuter les tests Jest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: myfamilyapp_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests automatisés Backend (Jest)
        env:
          NODE_ENV: test
          JWT_SECRET: KeyTestGithubActionsSecret2026
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: myfamilyapp_test_db
        run: |
          cd mfa-backend
          npm ci
      - name: Attente MySQL
        run: |
          sleep 20
          npm test

  # --- PHASE 2 : DÉPLOIEMENT CONTINU (CD) ---
  cd-deployment:
    needs: ci-testing
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Déploiement automatique sur VPS OVH (Debian 12) via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: debian
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/my_family_appli
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
